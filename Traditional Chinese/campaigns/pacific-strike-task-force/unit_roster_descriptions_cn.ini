[AllowedVessels]
usn_dd_gearing=基靈級驅逐艦是經改裝的戰時護航艦，具備良好火砲武裝與基礎反潛能力。這些艦艇已接近服役壽命末期，由後備艦隊重新啟用，最適合用來對付能力較低的潛艦與水面單位。
usn_ff_garcia=加西亞級巡防艦是基礎反潛掩護艦，搭載一架 SH-2F 直升機。它們能擴大編隊的潛艦搜索範圍，但幾乎沒有飛彈防禦能力，必須留在防空能力較佳護航艦的防空傘內。
usn_ffg_brooke=布魯克級巡防艦提供緊湊的護航能力，兼具飛彈與反潛功能。相較前一代加西亞級更有能力，但其 Mark 22 發射器只能攜帶 16 枚 SM-1MR 飛彈，限制了防空效能。
usn_ff_knox=諾克斯級原本用於取代加西亞級，於 1960 年代末至 1970 年代中期建造近 50 艘。它們與加西亞級一樣，以 AN/SQS-26、ASROC 與 DASH 無人反潛直升機為核心設計。初期幾乎沒有防空能力，後來改裝可搭載海麻雀與 SH-2F Seasprite。
1980 年代時，本級艦加裝魚叉飛彈：ASROC 發射器中有 2 個發射槽改裝裝填魚叉，而非 RUR-5 ASROC。Late 掛載會加入 AN/SQR-18A(V)1 拖曳陣列，使潛艦探測距離約可達第一匯聚區。
usn_ff_knox_84=諾克斯級巡防艦是反潛護航艦，具備良好聲納套件並支援一架 SH-2F 直升機。近期改裝為本級艦加入魚叉飛彈與方陣 CIWS。其 AN/SQR-18A 拖曳陣列可將潛艦探測距離延伸至約第一匯聚區。
usn_ffg_oliver_hazard_perry=奧利弗・哈札德・派里級巡防艦是能力均衡的護航艦，搭載兩架直升機、魚叉飛彈與中程防空能力。它們是靈活的外圍警戒艦，若與更強的防空專職艦混編尤其有效。
usn_ffg_oliver_hazard_perry_longhull=奧利弗・哈札德・派里級巡防艦，又稱 FFG-7 或 Fig 7，是大量建造的低成本通用艦艇。美國海軍與其他親美海軍共建造超過 70 艘。本級設計用於中等威脅環境，武器系統與冗餘性不如同時代的史普魯恩斯級。派里級有兩種主要版本，此為「長艦體」型，可搭載 SH-60 LAMPS Mk.III 直升機，並配備 SQR-18 或 SQR-19 TACTAS 拖曳陣列，使反潛潛力大幅提升。Default 掛載的 AN/SQR-18A 約可達第一匯聚區；Late 掛載的高性能 AN/SQR-19 可達第二匯聚區，使本艦成為顯著的戰力倍增器。
usn_ddg_adams_early=查爾斯・F・亞當斯級驅逐艦是可靠的主力艦，具備區域內防空能力與兩門 5 吋砲。近期改裝加入魚叉飛彈，但缺乏機庫與拖曳陣列，反潛能力有限。此 Early 版本代表本級最初 13 艘，配備雙臂 Mark 11 發射器。
usn_ddg_adams_late=查爾斯・F・亞當斯級驅逐艦是可靠的主力艦，具備區域內防空能力與兩門 5 吋砲。近期改裝加入魚叉飛彈，但缺乏機庫與拖曳陣列，反潛能力有限。此 Late 版本代表本級最後 10 艘，配備射速更快的單臂 Mark 13 發射器，並額外搭載兩枚魚叉。
usn_ddg_coontz=孔茲級驅逐艦是較舊的飛彈驅逐艦，具備區域防空能力。它們可保護編隊抵禦空中威脅，但 Mark 10 發射器射速較慢，限制了同時接戰多個威脅的能力，且缺乏 CIWS 系統。
usn_ddg_mahan=USS Mahan 於 1980 年改裝為 NTU 計畫測試艦。她具備異常強大的現代化防空能力；戰時需求使本艦可作為一線防空護航艦投入使用。
usn_dd_spruance=史普魯恩斯級驅逐艦是強大的反潛平台，擁有兩架直升機、拖曳陣列與優秀艦體聲納。它們是能力出色的潛艦獵手與編隊屏衛，但防空需仰賴其他艦艇。戰時本級艦已更新，可操作 SH-3H 直升機以及 SH-2F，進一步提升反潛能力。
usn_dd_spruance_abl=1980 年代初期，數艘史普魯恩斯級驅逐艦加裝 Mark 143 裝甲箱式發射器（ABL）以發射戰斧巡弋飛彈，為本級強大的反潛與直升機能力加入對陸打擊能力。它們是多用途護航艦，可支援對陸攻擊，同時維持反潛屏衛。戰時本級艦已更新，可操作 SH-3H 直升機以及 SH-2F，進一步提升反潛能力。
usn_ddg_kidd=基德級驅逐艦是現代化多任務護航艦，具備強大的 SM-1MR 飛彈火力、魚叉、反潛能力、直升機與 CIWS。它們是優秀的全能屏衛指揮艦，但缺乏拖曳陣列，因此最好與其他反潛艦艇搭配運用。
usn_cg_belknap=貝爾納普級巡洋艦以 SM-2ER 飛彈提供區域防空。它們是珍貴的編隊防空支柱，可在極遠距離接戰目標，但 Mark 10 發射器裝填較慢，最好搭配射速更快的 SM-1MR 艦艇形成分層防禦。不同於李海級，貝爾納普級有機庫與艦艉火砲，運用更具彈性。
usn_cg_leahy=李海級巡洋艦是強大的雙端防空艦，搭載 SM-2ER 飛彈，可在極遠距離接戰目標。它們專精於長程防空，應搭配射速較快的 SM-1MR 護航艦形成分層防禦。
usn_clg_oklahoma_city=USS Oklahoma City 是戰時輕巡洋艦，於 1960 年徹底改建為旗艦與飛彈巡洋艦。她由後備艦隊重新啟用，飛彈系統已經過時，但其 6 吋速射砲非常適合岸轟。
usn_cgn_california=加利福尼亞級核動力巡洋艦是多用途護航艦，擁有雙端 Mark 13 發射器與 80 枚 SM-1MR 攔截彈彈庫。它們沒有直升機，反潛能力也有限，但作為編隊防空艦可靠且續航力優異。
usn_cgn_virginia=維吉尼亞級核動力巡洋艦是高階多用途護航艦，搭載可發射 SM-1MR 的雙臂 Mark 26 發射器、魚叉飛彈與有限反潛能力。與加利福尼亞級一樣沒有直升機，但具備更高戰鬥能力與續航力，是強大的防空作戰艦。
usn_cgn_long_beach_83=長灘號是強大的防空巡洋艦，搭載長程 SM-2ER 飛彈與充足彈庫。她也搭載戰斧飛彈用於對陸攻擊，但沒有直升機且反潛能力有限，因此必須有護航。
usn_cg_ticonderoga=提康德羅加級巡洋艦是現存最現代化的防空艦，配備 AEGIS 作戰系統與 SPY-1 雷達。它們是頂尖防空艦，可應對多數空中威脅；若與貝爾納普、李海或長灘等更長程 SM-2ER 艦搭配，效果尤佳。
usn_bb_iowa=愛荷華級戰艦是重武裝、重裝甲的水面戰鬥艦，擁有強大火砲與反艦飛彈火力。它們擅長岸轟與水面存在，但沒有反潛或防空能力，必須由其他單位護航。
usn_lha_tarawa=塔拉瓦級兩棲突擊艦提供大型航空與兩棲作戰平台，適合直升機密集運用。它們是重要支援艦，但自身防禦不足以應對高威脅區域，必須有護航。
usn_cv_kitty_hawk=小鷹級航空母艦是戰略航空平台，可跨海投射空中力量。它們能大幅擴張特遣隊作戰半徑，但必須由分層護航艦與潛艦保護。

usn_avp_barnegat_mod=博尼法西奧級巡防艦由水上飛機母艦改裝而來，原作為戰爭剩餘物資提供給南越，後進入菲律賓服役。艦體中部加裝四枚筒裝魚叉飛彈，艦艉臨時直升機平台可支援輕型攻擊直升機。

ran_ddg_perth=伯斯級驅逐艦是澳洲版美國查爾斯・F・亞當斯級驅逐艦。其構型與美國設計略有不同，以艦體中部的 Ikara 反潛武器取代 ASROC 發射器；除此之外，武裝與能力大致等同於後期亞當斯級。
ran_ffg_adelaide_shorthull=阿德萊德級巡防艦是澳洲版美國派里級巡防艦。它們是具備區域內防空能力的珍貴護航艦。戰時改裝後可操作美國 SH-2F 直升機。

jmsdf_dd_yamagumo=山雲級驅逐艦是較舊的海上自衛隊護航艦，完全聚焦反潛。由於缺乏防空能力，應在其他艦艇防空飛彈掩護下行動。
jmsdf_dd_takatsuki=高月級驅逐艦是能力良好的反潛平台，具備兩門 5 吋砲並支援 QH-50 DASH 無人直升機。其防空能力非常有限，最適合用於對付潛艦或能力較低的敵方水面單位。
jmsdf_ddg_tachikaze=太刀風級驅逐艦是現代化日本防空艦，艦艉配備 Mark 13 發射器。其能力接近美國查爾斯・F・亞當斯級驅逐艦，是優秀的全用途戰鬥艦。
jmsdf_ddh_haruna=榛名級直升機驅逐艦是專門化反潛指揮護航艦，搭載大型直升機分隊。它們是優秀的反潛屏衛旗艦，但缺乏自衛飛彈；若預期遭遇空襲，應安排護航。

[AllowedHelicopters]
usn_sh-2f=SH-2F 直升機可擴大艦艇反潛搜索範圍，並協助在艦體聲納範圍外追擊潛艦接觸。其雷達也能向前偵察，為巡防艦與驅逐艦執行水面偵察。
usn_sh-3h=SH-3H 直升機是長程反潛機，配備吊放聲納、磁異探測器、聲納浮標與魚雷。它不像 SH-2F 那樣配備水面搜索雷達，因此最擅長追擊潛艦與搜救，而非空中偵察。
usn_qh-50d=QH-50 DASH 無人機可為老式護航艦提供輕量遠距反潛能力。它能延伸魚雷投送距離，但缺乏感測器與乘員，因此其他用途都很有限。
jmsdf_hss-2=HSS-2 直升機是長程反潛機，配備吊放聲納、磁異探測器、聲納浮標與魚雷。它不像 SH-2F 那樣配備水面搜索雷達，因此最擅長追擊潛艦與搜救，而非空中偵察。
usmc_ah-1t=AH-1T 攻擊直升機可從能搭載它們的艦艇上提供近接空中支援、火箭攻擊與反裝甲火力。它們對暴露的水面或陸上目標很危險，但沒有雷達，不應作為偵察機使用。
fr_as-350=AS350 直升機是用於運輸與聯絡的輕型通用機。它們是低成本支援資產，但沒有戰鬥感測器或武器，應遠離爭奪中的空域。在澳洲服役時，它們曾自阿德萊德級巡防艦操作，作為訓練機，並兼具次要偵察與戰鬥搜救任務。

[AllowedAircraft]
fr_mirage_iii=幻象 IIIO 戰鬥機提供基礎空對空能力，但飛彈射程較短，面對更現代化攔截機時處於劣勢。
raaf_f-111c=F-111C 打擊機具備長航程、重載量與優秀深度打擊潛力。澳洲服役型針對精確打擊與反艦任務配置，並可攜帶 AIM-9 飛彈自衛，因此比其他攻擊機更具彈性。
usn_ea-6b=EA-6B 提供電子戰支援，可提升打擊機生存性並干擾敵方感測器。其強大的 AN/ALQ-99 干擾莢艙能降低敵方感測器效能與防禦效率，是重要的戰力倍增器。
usn_f-14a=F-14A 是高階艦隊防空戰鬥機，具備長程攔截能力。強大的雷達與 AIM-54A 飛彈使其成為美國航艦航空隊首屈一指的制空戰鬥機。
usn_fa-18a=F/A-18A 打擊戰鬥機是北約可用的最新多用途戰機。它能執行空戰與對地攻擊，是高度靈活、適用多種角色的機種。這些澳洲飛機雖技術上仍在測試，但因戰時需求已投入服役。
usn_p-3c=P-3C 是長程海上巡邏平台，用於大範圍搜索與反潛追擊。它們很適合在威脅接近主力前發現潛艦與水面接觸。
usmc_av-8a=AV-8C 獵鷹式提供短程垂直／短場起降攻擊能力，可從兩棲航空甲板與機場操作。它們擅長快速周轉的近接支援、輕型打擊與區域 SEAD 任務，但面對現代戰鬥機與密集防空時需要保護。
usn_a-7e=A-7E 是可靠的輕型攻擊平台，適合打擊與近接支援任務。它有良好的載彈效率，但進入有防禦的空域時需要護航與電子支援。
usn_a-6e=A-6E 是全天候攻擊平台，具備強大的海上打擊能力。若搭配戰鬥機掩護與電子戰支援，非常適合執行高危險打擊任務。
usn_e-2c=E-2C 為海軍航空作戰提供空中預警與指揮管制。它能延伸偵測距離並改善反應時間，是強大的戰力倍增器。
usn_s-3a=S-3A 是航艦反潛平台，具備強大的海上巡邏與支援能力。最適合用於在航艦與主要水面群外圍建立反潛屏障。
usaf_f-15c=F-15C 是專職制空戰鬥機，具備優異性能與飛彈能力。可用於奪取制空權並保護打擊編隊免受敵方戰鬥機攻擊。
usaf_f-4e=F-4E 是靈活的老式戰鬥機，可支援防空與打擊任務。雖然性能不如新型制空平台，但仍適合混合編隊。
usaf_e-3a=E-3A AWACS 提供廣域空中監視與指揮支援。它是空中作戰的重要戰力倍增器，可提升大範圍偵測與協調能力。
usaf_b-52g=B-52G 轟炸機可對大型或固定目標提供重型長程打擊能力。它需要謹慎規劃與保護，但能造成戰術飛機無法達成的效果。