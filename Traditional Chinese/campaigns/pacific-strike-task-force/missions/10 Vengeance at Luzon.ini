Taskforce1StartMessage=Title=<size=24>Pacific Strike - Part 10</size>\nВозмездие в Лусоне\n<size=24>Октябрь 8-е, 1985</size>\nBody=Силы противника в Южно-Китайском море предпринимают  решительное наступление, чтобы деблокировать свои войска на Палаване. Ударная группа «Киев» выдвинулась вчера на юго-восток из Гонконга, прикрывая конвой с подкреплениями из Камрани. Уничтожьте и конвой, и ударную группу «Киев», прежде чем подкрепления достигнут Палавана.\nButtonText=Начать миссию\nPopupStyle=Intro
StartForecast=Прогноз погоды для Южно-Китайского моря\nАктуален: 082000Z-090200Z Октябрь 85\nТропический грозовой фронт над западной частью острова Лусон и северной частью моря Сулу вызывает сплошную облачность, грозы, дождь, туман и волнение моря силой 4 балла. В начальный период ожидается плохая видимость
Taskforce1FlagshipmustsurviveMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! Флагман {FlagshipName} был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=Ком. Тихоокеанским флотом США\nTo={TaskForceName}\nInfo=Ком. нач. штабов, Вашингтон ОК\nКом. ВМС США в Японии, Авиабаза Йокота\nКом. ВМС США на Филиппинах, Манила\nSubj=МИССИЯ ВЫПОЛНЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=ЛИЧНО КОМАНДИРУ\n\n1. (S) Данные национальных технических средств разведки и донесения с авиабазы Кларк подтверждают уничтожение ударной группы «Киев». Конвой с подкреплениями из Камрани остановлен, не дойдя до Палавана.\n\n2. (S) Попытка противника деблокировать свои силы на Палаване провалилась. Командиры десантных сил оценивают, что организованные морские подкрепления не смогут вовремя достичь Кесона и повлиять на ход текущего сражения.\n\n3. (S) Вы устранили главную советскую авианосную угрозу в Южно-Китайском море и выиграли для операции «Челленджер» критически важное время.\n\n4. (S) Отличная работа, командир! По возможности подберите выживших, затем по отходите в Субик для пополнения запасов.\nButtonText=Вернуться к миссии\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce130minweatherchangeMessage=From=Ком. ТГ 77\nTo={TaskForceName}\nInfo=\nSubj=РАДИОПЕРЕХВАТ\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) ПРЕДУПРЕЖДЕНИЕ: с северо-запада перехватывается радиообмен в диапазоне УКВ. Оценивается как сеть координации между кораблями и авиацией. Вероятно, надводные силы противника поддерживают связь с дальними морскими разведывательными и ударными самолётами из Камрани или с Хайнаня.\n\n2. (S) Рекомендуется объявить воздушную тревогу, код КРАСНЫЙ. Если самолёты противника обнаружат {TaskForceName}, следует ожидать немедленного ракетного удара. Удачи вам.\nButtonText=Продолжить\nPopupStyle=NavalMessage
Taskforce1DetectSlavatoshowobjectiveMessage=From=Ком. нач. штабов, Вашингтон ОК\nTo={TaskForceName}\nInfo=Ком. ТГ 77, Субик Бэй\nКом. Тихоокеанским флотом США, Пёрл-Харбор\nSubj=ОБНАРУЖЕНА КУГ ПРОТИВНИКА\nPrecedence=Flash\nClassification=Secret\nTemplate=USAJCS\nBody=1. (S) ПРЕДУПРЕЖДЕНИЕ: к западу от конвоя с подкреплениями в Южно-Китайском море обнаружено крупное соединение кораблей противника, сосредоточенное вокруг крейсера «Слава».\n\n2. (S) Ранее в этом месяце это соединение сопровождалось подводными лодками союзников, однако успешно уклонилось от атаки.\n\n3. (S) Уничтожение конвоя с подкреплениями противника и группы «Киев» остаётся приоритетом. Если тактическая обстановка позволит, перехватите и уничтожьте КУГ «Слава» вместе с оставшимися силами противника. Удачи и хорошей охоты.\nButtonText=Продолжить\nPopupStyle=NavalMessage
