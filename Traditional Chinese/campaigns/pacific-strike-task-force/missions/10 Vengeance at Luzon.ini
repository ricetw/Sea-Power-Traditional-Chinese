Taskforce1StartMessage=Title=<size=24>太平洋打擊：第10部分</size>\n呂宋的復仇\n<size=24>1985年10月8日</size>\nBody=敵軍正全力從南海進軍，嘗試解救其在巴拉望的部隊。基輔號打擊群昨日從香港向東南方移動，掩護一支來自金蘭灣的護航隊。務必在增援抵達巴拉望之前摧毀此護航隊和基輔號打擊群。\nButtonText=開始任務\nPopupStyle=Intro
StartForecast=南海區域艦隊天氣預報\n有效期：1985年10月08日2000Z時至09日0200Z時\n呂宋西部和蘇祿海北部上空的熱帶風暴帶來了密集的陰雲、雷暴、降雨、霧和4級海況。初期能見度極差，克拉克機場的起降作业將受到限制，直至風暴開始減弱。預計2130Z時至2200Z時之間，隨著降雨漸停，霧和雷暴東移，海況減弱至3級，狀況將有所好轉。
Taskforce1FlagshipmustsurviveMessage=Title=任務失敗！\nBody=任務失敗！{FlagshipName}號已被擊沉！\nButtonText=返回任務\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=太平洋艦隊總司令\nTo={TaskForceName}\nInfo=華盛頓特區參謀長聯席會議\n日本橫田空軍基地美國駐日本部隊司令\n菲律賓馬尼拉美國駐菲律賓部隊司令\nSubj=戰果評估——任務完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=指揮官本人閱讀\n\n1.（機密）國家技術手段和克拉克機場的報告確認基輔號打擊群已被摧毀，來自金蘭灣的增援護航隊在巴拉望附近遭到攔截。\n\n2.（機密）敵方嘗試解救巴拉望部隊的行動已經失敗。登陸部隊指揮官評估沒有成建制的海上增援可以及時抵達奎松並影響當前戰局。\n\n3.（機密）你消除了南海方向的重大航艦威脅，為挑戰者行動爭取了關鍵的時間。\n\n4.（機密）幹得漂亮，指揮官。盡可能營救倖存者，再根據指示返回蘇比克灣進行補給。\nButtonText=返回任務\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce130minweatherchangeMessage=From=第77特遣隊指揮官\nTo={TaskForceName}\nInfo=\nSubj=警告——截獲無線電\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（機密）我們截獲了西北方向的甚高頻俄語語音無線電信號，評估其為艦對空協調網。敵方水面部隊可能正在與來自金蘭灣或海南的遠程海上巡邏機進行通信。\n\n2.（機密）建議發布紅色防空警報——如果敵機發現{TaskForceName}，就會立即發動飛彈打擊。祝你好運。\nButtonText=收到並繼續\nPopupStyle=NavalMessage
Taskforce1DetectSlavatoshowobjectiveMessage=From=華盛頓特區參謀長聯席會議\nTo={TaskForceName}\nInfo=菲律賓蘇比克灣第77特遣隊指揮官\n夏威夷州珍珠港太平洋艦隊總司令\nSubj=接觸報告\nPrecedence=Flash\nClassification=Secret\nTemplate=USAJCS\nBody=1.（機密）警告：以光榮號為核心的大型水面編隊出現在了南海增援護航隊的西側。\n\n2.（機密）盟軍潛艦本月初曾跟蹤過此編隊，但它最終成功逃脫。\n\n3.（機密）摧毀敵方增援護航隊和基輔號打擊群仍是首要任務。如果戰術態勢允許，攔截並摧毀光榮號水面行動群。祝你好運，獵殺愉快。\nButtonText=收到並繼續\nPopupStyle=NavalMessage
