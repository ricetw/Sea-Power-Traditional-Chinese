Name=10呂宋的復仇
Description=敵方已派出基輔號航艦掩護前往巴拉望的增援護航隊。我方岸上部隊已陷入苦戰，敵方的增援部隊可能將成為勝負手。從民都洛島向西航行，找到基輔號，在敵方航艦和護航隊抵達巴拉望之前將其摧毀。
