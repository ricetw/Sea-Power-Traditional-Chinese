[LoadingTips]
Count=12
Header=提示
Tip001=Harpoon 與反艦型 Tomahawk 飛彈不會避開地形。發射前請確認路徑暢通。
Tip002=分散編隊會讓敵方較難透過雷達判讀。
Tip003=Standard 飛彈可用於視距內反水面交戰，且在此用途上比 Harpoon 更可靠。
Tip004=SH-2F 直升機可為美國海軍護航艦提供空中水面搜索雷達。它們能偵測超出艦載雷達距離的水面接觸，但無法搜索飛機。
Tip005=Sovremenny 級驅逐艦搭載 SS-N-22 Sunburn。這是當時最有能力的反艦飛彈，但受限於 48 海里的射程。
Tip006=Udaloy 級巡防艦搭載 SA-N-9 防空飛彈系統，對 Harpoon 與 Exocet 等掠海飛彈尤其有效。
Tip007=飛機干擾會大幅降低敵方防空系統效能。
Tip008=SS-N-14A（Metel）反潛武器由 Krivak 與 Kresta II 級反潛艦搭載。SS-N-14B（Rastrub）增加次要反艦能力，配備於 Krivak II、Kara 與 Udaloy 級，射程 27 海里。
Tip009=按 Tab 可快速最大化戰術顯示器（地圖）。
Tip010=按 Z 可從支援單位使用雙筒望遠鏡、光電裝置或潛望鏡。
Tip011=使用地圖工具標示已識別敵方單位的防空飛彈與反艦飛彈最大射程。
Tip012=滑鼠停在底部列武器上時按住 Alt，可在戰術地圖與 3D 視角中顯示其射界。
